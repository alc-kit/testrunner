# A toy subscriber: the "system under test" is a pretend service living in a directory.
# Everything a real subscriber has is here, small: python and shell exports, a state
# model, a default path, run configs, an expect rule, an observer.
modules: [actions/]
state_dir: state                 # the SUBSCRIBER's state — testrunner keeps none
params_section: params
configs: {dir: configs, env: TOY_CONFIG, link: toy.yml}

# The state machine, all of it: each variable's values, how a claimed value is confirmed
# (`validate:`), and every change an action may make (`transitions:`). The actions declare the
# same changes in their `produces`; if the two disagree, the plan is refused.
states:
  service:
    initial: absent
    validate: {outcome: true}     # a claim holds when the step that made it passed
    values:
      absent:    {criterion: "the sandbox holds no service file"}
      installed: {criterion: "the service file says installed"}
      running:   {criterion: "the service file says running"}
    transitions:
      - {from: "*", to: installed, by: install,   on: passed}
      - {from: "*", to: running,   by: start,     on: passed}
      - {from: "*", to: absent,    by: uninstall, on: passed}
    # read by the @observer in actions/service.py
  data:
    initial: empty
    validate: {outcome: true}
    values: [empty, seeded]
    transitions:
      - {from: "*", to: seeded, by: seed,      on: passed}
      - {from: "*", to: seeded, by: repair,    on: passed}
      - {from: "*", to: empty,  by: uninstall, on: passed}
    model_only: true              # nothing reads it back: its value is what the steps claimed

paths:
  lifecycle: [install, start, seed, verify]

# The first state-changing run commits this directory to its run config; it is released
# when a run leaves the service absent (or by `--release`).
scenario:
  release_when: {service: absent}

actions:
  install:                        # a shell export, with an interactive confirmation
    doc: install the service (asks for confirmation)
    run: ["bash", "scripts/install.sh", "{sandbox}"]
    rules: scripts/install-rules.yml
    requires: {service: absent}
    produces: {service: installed}
  uninstall:
    doc: remove the service
    run: "rm -rf '{sandbox}'"
    produces: {service: absent, data: empty}
