name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml==6.0.3 pytest==9.1.1 pytest-xdist==3.8.0
      # the Vagrant layer's tests load Vagrantfiles with ruby; a runner without one must FAIL
      # here, never skip them silently
      - run: ruby --version
      # in parallel (pytest-xdist; measured 2026-10-29: 37 s serial, 11-15 s with -n auto, the same
      # 678 tests); every test must therefore be safe beside the others
      - run: python -m pytest -q -n auto tests
  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/content-guard
